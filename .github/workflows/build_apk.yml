name: Build Android APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build_android:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Free Disk Space
        continue-on-error: true
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo apt clean || true
          docker image prune -af || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/local/share/vcpkg || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache || true
          df -h

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Create Keystore & key.properties
        run: |
          keytool -genkey -v -keystore android/app/keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias namida -storepass namidapass -keypass namidapass \
            -dname "CN=Namida, OU=App, O=Namida, L=Paris, S=IDF, C=FR"
          cat <<EOF > android/key.properties
          storePassword=namidapass
          keyPassword=namidapass
          keyAlias=namida
          storeFile=keystore.jks
          EOF

      - name: Get Flutter dependencies
        run: |
          flutter pub get

      - name: Build APK (Release)
        run: |
          flutter build apk --release

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: namida-android-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14

      - name: Create Release and Upload APK
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          name: Namida Build ${{ github.sha }}
          tag_name: build-${{ github.sha }}
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
