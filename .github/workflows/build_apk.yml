name: Build Android APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_android:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Fetch FFmpegKit bundle for Android
        run: |
          mkdir -p external/ffmpeg_build/ffmpegkit
          curl -L -f -o external/ffmpeg_build/ffmpegkit/bundle-namida-shared-lgpl-release.aar \
            https://github.com/MSOB7YY/ffmpeg-kit-builders/releases/download/v0.11.5-android/bundle-namida-shared-lgpl-release.aar
          ls -lh external/ffmpeg_build/ffmpegkit/

      - name: Free Disk Space
        continue-on-error: true
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo apt clean || true
          docker image prune -af || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/local/share/vcpkg || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache || true
          df -h

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Create Keystore & key.properties
        run: |
          keytool -genkeypair -v -keystore android/app/keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias namida -storepass namidapass -keypass namidapass \
            -dname "CN=Namida, OU=App, O=Namida, L=Paris, S=IDF, C=FR"
          cat <<EOF > android/key.properties
          storePassword=namidapass
          keyPassword=namidapass
          keyAlias=namida
          storeFile=keystore.jks
          EOF

      - name: Get Flutter dependencies
        run: |
          flutter pub get

      - name: Analyze Dart code
        continue-on-error: true
        run: |
          flutter analyze --no-fatal-infos

      - name: Build APK (Release arm64)
        run: |
          set -o pipefail
          flutter build apk --target-platform android-arm64 --release 2>&1 | tee build_log.txt

      - name: Print failure log
        if: failure()
        run: |
          echo "==== TAIL OF BUILD LOG (LAST 150 LINES) ===="
          tail -n 150 build_log.txt || true

      - name: List generated APKs
        run: |
          ls -lh build/app/outputs/flutter-apk/ || true

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: namida-android-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14

      - name: Create Release and Upload APK
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          name: "Namida Nova v8.6.0-beta - Listening Party & Redesigned Tabs"
          tag_name: "v8.6.0-nova-apk"
          draft: false
          prerelease: true
          body: |
            ### Namida Nova v8.6.0-beta (Listening Party Overhaul & Tab Simplification)
            
            This release contains the Android APK built automatically by GitHub Actions:
            - **Modern 2-Button Lobby**: Easy choice between "Créer un salon" and "Rejoindre un salon".
            - **Creation & Join Flows**: Fast setup with custom username, party name, and optional password.
            - **Active Session UI**: Member avatars, centered artwork, synchronized live karaoke lyrics, host controls, and guest view.
            - **iTunes Search Fallback Resolver**: Automatic high-accuracy audio resolution on YouTube via canonical iTunes track metadata and duration verification.
            - **Simplified Navigation**: 9 core tabs with Ratings, Tags, and Moods grouped cleanly under "Tags & Notes".
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
